server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # DNS interno do Docker: resolve novamente após recriar um serviço.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/clientes/ {
        set $upstream http://cliente-service:9001;
        rewrite ^/api/clientes/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }
    location /api/quartos/ {
        set $upstream http://quarto-service:9002;
        rewrite ^/api/quartos/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }
    location /api/reservas/ {
        set $upstream http://reserva-service:9003;
        rewrite ^/api/reservas/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

