spring.application.name=quarto-service

spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_quarto
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true


server.port=9002

jwt.public-key=${JWT_PUBLIC_KEY_LOCATION}
jwt.issuer=hotel-auth

hotel.cors.origens=${FRONTEND_ORIGINS:http://localhost:5173}
