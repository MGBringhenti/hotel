spring.application.name=notificacoes-service

spring.main.web-application-type=none

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_notificacoes}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=hotel-notificacoes-v1

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties[allow.auto.create.topics]=false

spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=true

hotel.kafka.topico-reservas=hotel.reservas.v1

# Publicação das mensagens que falharam
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[request.timeout.ms]=10000
spring.kafka.producer.properties[delivery.timeout.ms]=30000

hotel.kafka.topico-reservas-dlt=hotel.reservas.v1.DLT

hotel.cliente-service.url=${CLIENTE_SERVICE_URL:http://localhost:9001}
hotel.cliente-service.client-id=notificacoes-service
hotel.cliente-service.client-secret=${NOTIFICACOES_CLIENT_SECRET}

# E-mail local: Mailpit
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.default-encoding=UTF-8

spring.mail.properties[mail.smtp.auth]=false
spring.mail.properties[mail.smtp.starttls.enable]=false
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

hotel.notificacoes.remetente=reservas@hotel.test

hotel.notificacoes.envio-habilitado=${NOTIFICACOES_ENVIO_HABILITADO:false}
hotel.notificacoes.atraso-inicial-ms=10000
hotel.notificacoes.intervalo-ms=2000