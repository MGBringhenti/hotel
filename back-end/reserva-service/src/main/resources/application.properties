spring.application.name=reserva-service

# Conexão com o banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_reservas
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuração do Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Implementação do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Conexão com Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Envia a chave e o conteúdo como texto
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Confirmação e proteção contra duplicação nas tentativas do produtor
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true

# Limites de espera em milissegundos
spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[request.timeout.ms]=10000
spring.kafka.producer.properties[delivery.timeout.ms]=30000

# Tópico dos eventos de reserva
hotel.kafka.topico-reservas=hotel.reservas.v1

# Porta do serviço
server.port=9003

# Configuração do JWT
jwt.public-key=${JWT_PUBLIC_KEY_LOCATION}
jwt.issuer=hotel-auth

#Configuração dos serviços de quarto e cliente
services.quarto.url=${QUARTO_SERVICE_URL:http://localhost:9002}
services.cliente.url=${CLIENTE_SERVICE_URL:http://localhost:9001}

#Configuração do outbox
hotel.outbox.habilitado=${OUTBOX_HABILITADO:true}
hotel.outbox.atraso-inicial-ms=10000
hotel.outbox.intervalo-ms=2000

#Configuração do cors
hotel.cors.origens=${FRONTEND_ORIGINS:http://localhost:5173}
