spring.application.name=cliente-service

spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_clientes
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true

server.port=9001

jwt.private-key=${JWT_PRIVATE_KEY_LOCATION}
jwt.public-key=${JWT_PUBLIC_KEY_LOCATION}
jwt.issuer=hotel-auth

admin.inicial.login=${ADMIN_INICIAL_LOGIN:}
admin.inicial.senha=${ADMIN_INICIAL_SENHA:}
admin.inicial.email=${ADMIN_INICIAL_EMAIL:}

hotel.servicos.notificacoes.client-id=notificacoes-service
hotel.servicos.notificacoes.client-secret=${NOTIFICACOES_CLIENT_SECRET}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

hotel.email.remetente=${EMAIL_REMETENTE:seguranca@hotel.test}

hotel.cors.origens=${FRONTEND_ORIGINS:http://localhost:5173}
