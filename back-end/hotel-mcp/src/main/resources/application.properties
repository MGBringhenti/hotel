spring.application.name=hotel-mcp

# O banner não pode ocupar a saída usada pelo protocolo MCP.
spring.main.banner-mode=off

# Identificação do servidor MCP.
spring.ai.mcp.server.name=hotel-mcp
spring.ai.mcp.server.version=0.0.1

# Execução síncrona e comunicação por entrada/saída do processo.
spring.ai.mcp.server.type=SYNC

# Endereços das APIs existentes.
hotel.services.quarto-url=${HOTEL_QUARTO_URL:http://localhost:9002}
hotel.services.reserva-url=${HOTEL_RESERVA_URL:http://localhost:9003}

# Token fornecido pelo ambiente.
hotel.api-token=${HOTEL_API_TOKEN:}

spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.protocol=STREAMABLE
server.port=9004